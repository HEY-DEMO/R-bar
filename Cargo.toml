[package]
name = "taskbar-clone"
version = "0.1.0"
edition = "2021"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Power",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
] }
slint = "1.9"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
slint-build = "1.9"

